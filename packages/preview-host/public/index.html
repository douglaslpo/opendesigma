<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenDesigma preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f0ea;
        --ink: #1a1a18;
        --muted: #5c5a54;
        --accent: #0f6b5c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #d9efe8 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #efe6d4 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        font-size: 1.05rem;
        line-height: 1.5;
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        color: var(--accent);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenDesigma</h1>
      <p>
        Preview host is up. Point <code>--root</code> at a static export or
        prototype artifacts, then share this URL via <code>ship-preview</code>.
      </p>
      <p><a href="/healthz">/healthz</a></p>
    </main>
  </body>
</html>
